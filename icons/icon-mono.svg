<svg xmlns="http://www.w3.org/2000/svg" viewBox="42 42 940 940">
  <!-- Personal Compass, one colour. For Safari's pinned tab and anywhere else
       that takes a silhouette and tints it itself.

       **The viewBox matches `favicon.svg`'s** — read the derivation there
       (#526). Two `any` surfaces framing the same drawing differently would be
       #385's shape: two faces disagreeing about one fact.

       **The white disc is deliberately absent.** A mask-icon is filled with a
       single colour whatever the file says, so a disc would fill solid and
       swallow the star. What is left is the outline the star reads from — and
       the ring's own taper survives, because it is a shape rather than a stroke. -->
