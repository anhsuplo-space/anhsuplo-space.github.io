<svg xmlns="http://www.w3.org/2000/svg" viewBox="42 42 940 940">
  <!-- Personal Compass. Drawn by the owner (design/ai/icon-01.svg); this is that
       file with the Illustrator artefacts removed and two colours named so the
       tab icon follows the browser's theme.

       The disc is a real shape, not a background: it is what makes the star
       readable when the icon sits on a dark strip. It follows the ground rather
       than staying white, or a dark theme would show a white plate.

       **[v7.9.75, #526] The viewBox is TRIMMED PAPER, not a redrawn icon.**
       The paths are the owner's, untouched, on their original 1024 artboard;
       what moved is the frame around them. At `0 0 1024 1024` the furthest ink
       sat at 88.1% of the half-edge, so the drawing spanned 77.9% of the tile —
       and in a taskbar that cost twice over, because this icon carries a white
       plate AND a margin inside the plate while a full-bleed neighbour's tile is
       the icon. A 940 square centred on (512, 512) puts the furthest ink at
       **96%** and the drawing at **85%** of the tile.

       This is the division #514 set when it scaled the maskable to 0.911: the
       fix belongs to GENERATION, not to drawing — which is why the taper, the
       disc and the dot's overshoot all survive exactly as drawn.

       **To re-derive after a redraw**, never nudge: measure the furthest ink
       from (512, 512) in the artboard's own units, then `size = radius / 0.48`
       and centre the box on it. 96 rather than 100 is antialiasing headroom. -->
  <style>
    .disc { fill: #ffffff }
    .ink  { fill: #2b2926 }
    @media (prefers-color-scheme: dark) {
      .disc { fill: #1e1e1c }
      .ink  { fill: #ecebe5 }
    }
  </style>
